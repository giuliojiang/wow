<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="color-scheme" content="dark"/>
<title>Morrigan's Midnight Tips</title>
<link rel="icon" href="data:," />
<style>
  :root{
    --bg:#0c0e12;
    --bg2:#10131a;
    --panel:#171a23;
    --panel2:#1e2230;
    --panel3:#252b3e;
    --line:#2a3148;
    --line2:#313a56;
    --ink:#e9ecf4;
    --muted:#9aa3bd;
    --muted2:#6b7591;
    --gold:#f5c518;
    --gold2:#ffe27a;
    --gold-dim:rgba(245,197,24,.14);
    --green:#3ae68a;
    --accent-venom:#6e84ff;
    --radius:18px;
    --radius-sm:12px;
    --shadow:0 10px 40px rgba(0,0,0,.45), 0 1px 0 rgba(255,255,255,.04) inset;
  }
  *{box-sizing:border-box}
  html{-webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; scrollbar-color:var(--line2) var(--bg)}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family: ui-sans-system, -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "SF Pro Text", Roboto, Helvetica, Arial, sans-serif;
    min-height:100dvh; line-height:1.6;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:-1;
    background:
      radial-gradient(900px 600px at 15% -10%, rgba(245,197,24,.10) 0%, transparent 60%),
      radial-gradient(800px 500px at 90% 0%, rgba(120,90,255,.12) 0%, transparent 60%),
      radial-gradient(600px 400px at 60% 120%, rgba(58,230,138,.07) 0%, transparent 60%);
  }
  button{font:inherit}
  .app{display:grid; grid-template-columns:320px 1fr; min-height:100dvh}
  @media (max-width:900px){.app{grid-template-columns:1fr}}

  .side{
    position:sticky; top:0; align-self:start; height:100dvh; overflow:auto;
    background:linear-gradient(180deg,var(--bg2) 0%, var(--bg) 100%);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column;
  }
  @media (max-width:900px){.side{position:static; height:auto; overflow:visible} .side .dungeon-list{display:none}}
  .side-top{padding:22px 18px 14px; border-bottom:1px solid var(--line); background:radial-gradient(400px 200px at 0% 0%, rgba(245,197,24,.08), transparent 70%)}
  .brand{display:flex; align-items:center; gap:12px; margin-bottom:14px}
  .brand-mark{
    width:36px; height:36px; border-radius:10px; display:grid; place-items:center;
    background:linear-gradient(135deg,var(--gold),#ff8a2a); color:#111; font-weight:800;
    font-family: ui-serif, Georgia, serif; font-size:18px; letter-spacing:-.02em;
    box-shadow:0 4px 18px rgba(245,197,24,.35);
  }
  .brand h1{margin:0; font-family: ui-serif, Georgia, "Times New Roman", serif; font-weight:700; letter-spacing:-.02em; font-size:19px; line-height:.95; color:var(--ink)}
  .brand h1 span{display:block; color:var(--gold); font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; margin-top:3px; font-family: ui-sans-system, system-ui, sans-serif; font-weight:600}
  .switch{display:flex; gap:6px; padding:6px; background:var(--panel); border:1px solid var(--line); border-radius:12px; margin-bottom:12px}
  .switch-btn{flex:1; padding:9px 8px; border-radius:9px; border:1px solid transparent; background:transparent; color:var(--muted); font-weight:600; font-size:12.8px; cursor:pointer; transition:.14s; letter-spacing:.02em}
  .switch-btn.active{background:linear-gradient(90deg,var(--gold),#ffb73a); color:#101010; border-color:rgba(255,255,255,.12); box-shadow:0 2px 12px rgba(245,197,24,.35)}
  .switch-btn:hover:not(.active){background:var(--panel2); color:var(--ink); border-color:var(--line2)}
  .search-wrap{position:relative}
  .search-wrap input{
    width:100%; background:var(--panel); border:1px solid var(--line);
    color:var(--ink); padding:11px 12px 11px 36px; border-radius:11px; outline:none;
    font-size:13.2px; transition:.15s;
  }
  .search-wrap input::placeholder{color:var(--muted2)}
  .search-wrap input:focus{border-color:var(--line2); background:var(--panel2); box-shadow:0 0 0 3px var(--gold-dim)}
  .search-wrap svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--muted2)}
  .clear-btn{position:absolute; right:8px; top:50%; transform:translateY(-50%); background:transparent; border:0; color:var(--muted2); cursor:pointer; padding:4px; border-radius:6px; display:none}
  .clear-btn.show{display:block}
  .dungeon-list{padding:10px 10px 18px; display:flex; flex-direction:column; gap:3px; flex:1}
  .season-head{font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--gold2); padding:14px 10px 6px; margin-top:6px; opacity:.95; border-top:1px solid rgba(255,255,255,.06)}
  .season-head:first-child{border-top:0; margin-top:0; padding-top:6px}
  .season-head.raid-head{color:var(--accent-venom); border-top-color:rgba(110,132,255,.15)}
  .dungeon-btn{text-align:left; padding:11px 12px; border-radius:10px; border:1px solid transparent; background:transparent; color:var(--muted); cursor:pointer; transition:.14s; display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13.6px; font-weight:500}
  .dungeon-btn:hover{background:var(--panel); color:var(--ink); border-color:var(--line)}
  .dungeon-btn.active{background:linear-gradient(90deg,var(--gold-dim),rgba(245,197,24,.06)); color:var(--ink); border-color:rgba(245,197,24,.28); box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  .dungeon-btn.raid-active{background:linear-gradient(90deg,rgba(110,132,255,.16),rgba(110,132,255,.05)); border-color:rgba(110,132,255,.35); color:var(--ink)}
  .dungeon-btn.active .count{background:var(--gold); color:#111}
  .dungeon-btn.raid-active .count{background:var(--accent-venom); color:white}
  .dungeon-btn .name{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .count{font-size:11px; font-weight:700; min-width:20px; height:20px; display:grid; place-items:center; border-radius:999px; background:var(--panel2); color:var(--muted2); border:1px solid var(--line); flex-shrink:0}
  .side-foot{padding:14px 16px; border-top:1px solid var(--line); color:var(--muted2); font-size:11.5px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}

  .main{min-width:0; padding:28px 28px 60px; max-width:1220px; width:100%}
  @media (max-width:900px){.main{padding:18px 16px 40px}}
  .header{display:flex; gap:18px; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; margin-bottom:24px; padding-bottom:20px; border-bottom:1px solid var(--line)}
  .header h2{margin:0; font-family: ui-serif, Georgia, serif; font-size:clamp(26px,4vw,38px); line-height:.95; letter-spacing:-.02em}
  .header h2 b{color:var(--gold)}
  .header h2.raid-title b{color:var(--accent-venom)}
  .pill{display:inline-flex; align-items:center; gap:7px; padding:7px 11px; border-radius:999px; background:var(--panel); border:1px solid var(--line); color:var(--muted); font-size:12.1px; font-weight:600; flex-wrap:wrap}
  .pill.gold{border-color:rgba(245,197,24,.28); background:rgba(245,197,24,.08); color:var(--gold2)}
  .pill.venom{border-color:rgba(110,132,255,.28); background:rgba(110,132,255,.10); color:#b9c3ff}
  .notice{background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:14px; padding:14px 16px; color:var(--muted); font-size:13px; display:flex; gap:12px; margin-bottom:22px}
  .notice strong{color:var(--ink)}
  .boss-grid{display:grid; gap:18px}
  .boss-card{background:linear-gradient(180deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
  .boss-head{padding:18px 20px 14px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line); background:linear-gradient(90deg,rgba(245,197,24,.08),transparent 60%)}
  .boss-head.raid-head{background:linear-gradient(90deg,rgba(110,132,255,.14),transparent 70%)}
  .boss-head h3{margin:0; font-family: ui-serif, Georgia, serif; font-size:18.5px; letter-spacing:-.01em; display:flex; align-items:center; gap:10px}
  .boss-icon{width:28px; height:28px; border-radius:9px; display:grid; place-items:center; background:var(--panel3); border:1px solid var(--line); font-size:13px; color:var(--gold)}
  .boss-icon.raid{color:var(--accent-venom)}
  .boss-head .mini{color:var(--muted2); font-size:12.2px; font-weight:600}
  .tips{padding:6px 10px 12px; display:flex; flex-direction:column}
  .tip-row{display:grid; grid-template-columns:1fr 320px; gap:14px; padding:12px 10px; border-radius:12px; transition:.12s; border:1px solid transparent}
  .tip-row:hover{background:rgba(255,255,255,.02); border-color:rgba(255,255,255,.04)}
  @media (max-width:920px){.tip-row{grid-template-columns:1fr}}
  .tip-text{font-size:14px; color:var(--ink); line-height:1.55; text-wrap:pretty; display:flex; gap:10px; align-items:flex-start}
  .tip-num{flex:0 0 26px; width:26px; height:26px; display:grid; place-items:center; background:var(--panel3); border:1px solid var(--line); border-radius:8px; color:var(--muted); font-size:11.5px; font-weight:700; margin-top:1px}
  .tip-row:hover .tip-num{color:var(--ink); border-color:var(--line2)}
  .tip-row:has(.tip-media.empty){grid-template-columns:1fr}
  .tip-media{position:relative; border-radius:12px; overflow:hidden; background:var(--panel3); border:1px solid var(--line); aspect-ratio:16/9; display:grid; place-items:center}
  .tip-media img{width:100%; height:100%; object-fit:cover; display:block; cursor:zoom-in; transition:.2s}
  .tip-media img:hover{transform:scale(1.02)}
  .tip-media.empty{display:none}
  .img-badge{position:absolute; left:8px; bottom:8px; background:rgba(0,0,0,.6); backdrop-filter:blur(6px); color:white; font-size:11px; padding:4px 7px; border-radius:7px; border:1px solid rgba(255,255,255,.15)}

  /* RAID specifics */
  .raid-body{padding:16px 18px 18px}
  .tldr{background:linear-gradient(90deg,rgba(245,197,24,.12),rgba(245,197,24,.02)); border-left:3px solid var(--gold); border-radius:10px; padding:12px 14px; font-size:13.8px; line-height:1.55; color:var(--ink); margin-bottom:14px}
  .tldr.venom-tldr{background:linear-gradient(90deg,rgba(110,132,255,.15),rgba(110,132,255,.02)); border-left-color:var(--accent-venom)}
  .tldr strong{color:var(--gold); margin-right:6px}
  .tldr.venom-tldr strong{color:#b9c3ff}
  .setup-line{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
  .strat{display:grid; gap:10px}
  .strat h4{margin:14px 0 6px; font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold2)}
  .strat h4.raid-h{color:#b9c3ff}
  .strat ul{margin:0; padding-left:18px; color:var(--ink); font-size:13.8px; line-height:1.55}
  .strat li{margin:5px 0}
  .strat li::marker{color:var(--muted2)}
  .img-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:14px}
  @media (max-width:700px){.img-grid{grid-template-columns:1fr}}
  .img-card{border-radius:12px; overflow:hidden; background:var(--panel3); border:1px solid var(--line); aspect-ratio:16/9; position:relative}
  .img-card img{width:100%; height:100%; object-fit:cover; display:block; cursor:zoom-in; transition:.2s}
  .img-card img:hover{transform:scale(1.02)}
  .img-card .cap{position:absolute; left:0; right:0; bottom:0; background:linear-gradient(0deg,rgba(0,0,0,.72),transparent); color:white; font-size:11.5px; padding:10px 10px 8px; backdrop-filter:blur(2px)}

  .no-results{padding:40px 20px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:16px; background:var(--panel)}
  .mobile-dungeons{display:none; margin-bottom:18px}
  @media (max-width:900px){
    .mobile-dungeons{display:block}
    .mobile-dungeons select{width:100%; padding:12px 14px; border-radius:12px; background:var(--panel); color:var(--ink); border:1px solid var(--line); font-size:14px}
  }
  .lightbox{position:fixed; inset:0; z-index:60; display:none; place-items:center; padding:20px; background:rgba(5,6,10,.78); backdrop-filter:blur(10px)}
  .lightbox.open{display:grid}
  .lightbox img{max-width:min(1100px,92vw); max-height:86vh; border-radius:14px; border:1px solid rgba(255,255,255,.12); box-shadow:0 20px 60px rgba(0,0,0,.7)}
  .lightbox .close{position:absolute; top:16px; right:16px; width:40px; height:40px; border-radius:99px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); color:white; cursor:pointer; display:grid; place-items:center}
  kbd{font-family:ui-monospace,monospace; font-size:11px; background:var(--panel3); border:1px solid var(--line); border-bottom-width:2px; padding:2px 6px; border-radius:6px; color:var(--muted)}

  /* readability tokens */
  .spell{
    display:inline-flex; align-items:center; gap:4px;
    padding:2px 8px; border-radius:999px;
    background:linear-gradient(180deg, rgba(122, 236, 236, .18), rgba(122, 236, 236, .08));
    border:1px solid rgba(122,236,236,.36);
    color:#8ef6f6; font-weight:700; font-size:12.4px; letter-spacing:.01em;
    box-shadow:0 0 0 1px rgba(122,236,236,.06) inset;
    white-space:nowrap;
  }
  .entity{
    font-weight:800; color:#f6e7b8; font-size:105%;
    text-decoration: underline dotted rgba(245,197,24,.45);
    text-underline-offset:3px; text-decoration-thickness:1.4px;
  }
  .entity::before{content:"◐"; font-size:.85em; margin-right:3px; opacity:.7}
  .role{
    display:inline-flex; align-items:center; justify-content:center;
    padding:1px 7px; border-radius:999px; font-size:10.6px; font-weight:800;
    text-transform:uppercase; letter-spacing:.07em; line-height:1.4;
    border:1px solid transparent; vertical-align:middle;
  }
  .role-tank{background:rgba(72,135,255,.16); border-color:rgba(72,135,255,.38); color:#8ab4ff}
  .role-healer{background:rgba(52,211,121,.16); border-color:rgba(52,211,121,.36); color:#7be6a2}
  .role-dps{background:rgba(255,90,90,.15); border-color:rgba(255,90,90,.36); color:#ff9494}
  .action{
    color:#ffe68f; font-weight:700; letter-spacing:.01em;
  }
  .action::before{content:"→ "; color:var(--gold); font-weight:900}
  strong.action{color:#ffe68f; font-weight:800}
  .dungeon-btn .raid-ico{
    width:32px; height:32px; border-radius:9px; object-fit:cover; flex:0 0 32px;
    border:1px solid rgba(255,255,255,.14); background:radial-gradient(120% 120% at 30% 20%, var(--panel3), var(--panel));
    box-shadow:0 2px 10px rgba(0,0,0,.36), 0 0 0 1px rgba(0,0,0,.18) inset;
    image-rendering:-webkit-optimize-contrast;
  }
  .dungeon-btn.raid-active .raid-ico{
    border-color:rgba(110,132,255,.42);
    box-shadow:0 2px 12px rgba(110,132,255,.22), 0 0 0 1px rgba(110,132,255,.18) inset;
  }
  .tank-box{
    margin:12px 0 14px; padding:12px 12px 10px 12px;
    border-radius:12px;
    border:1.5px solid #f0a500; border-left-width:4px;
    background:linear-gradient(180deg, rgba(240,165,0,.12), rgba(240,165,0,.04));
    box-shadow:0 6px 24px rgba(240,165,0,.12), inset 0 1px 0 rgba(255,255,255,.05);
    color:var(--ink);
  }
  .tank-box-head{display:flex; align-items:center; gap:10px; margin-bottom:8px; font-weight:800; letter-spacing:.02em; font-size:13.5px; color:#ffd27a}
  .tank-box-head .tb-icon{width:26px; height:26px; border-radius:8px; display:grid; place-items:center; background:linear-gradient(135deg,#ffb84d,#ffd27a); color:#1a1200; font-size:14px; font-weight:900; border:1px solid rgba(255,255,255,.18)}
  .tank-box ul{margin:6px 0 0 18px; padding:0; font-size:13.2px; line-height:1.52}
  .tank-box li{margin:5px 0}
  .tank-box li::marker{color:#ffb84d}

  .pn-top{
    display:flex; justify-content:space-between; gap:8px; margin:0 0 12px; align-items:center;
  }
  .pn-btn{
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
    border:1px solid var(--line); background:var(--panel2); color:var(--ink);
    border-radius:10px; cursor:pointer; transition:.14s; font-weight:600;
    text-align:left; max-width:44vw; overflow:hidden; text-overflow:ellipsis;
  }
  .pn-btn.small{padding:6px 10px; font-size:12.5px; border-radius:9px; opacity:.92}
  .pn-btn.large{padding:12px 18px; font-size:14px; border-radius:12px; min-width:160px; justify-content:center; font-weight:700}
  .pn-btn:hover{border-color:var(--line2); background:var(--panel3); transform:translateY(-1px)}
  .pn-btn:active{transform:translateY(0)}
  .pn-btn[disabled], .pn-btn.disabled{
    opacity:.32; pointer-events:none; border-style:dashed;
  }
  .pn-btn.venom:hover{border-color:rgba(110,132,255,.45); box-shadow:0 0 0 3px rgba(110,132,255,.12)}
  .pn-btn.gold:hover{border-color:rgba(245,197,24,.42); box-shadow:0 0 0 3px var(--gold-dim)}
  .pn-label{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:22ch}
  .pn-hint{font-size:10.5px; color:var(--muted2); letter-spacing:.06em; text-transform:uppercase; font-weight:700; margin-right:4px}

  /* Title deeplink */
  .deeplink{
    color:inherit; text-decoration:none; cursor:pointer; position:relative;
    display:inline-flex; align-items:center; gap:8px;
  }
  .deeplink:hover{ text-decoration:underline; text-underline-offset:4px; text-decoration-thickness:1.5px; }
  .header h2:not(.raid-title) .deeplink:hover{ text-decoration-color: var(--gold); }
  .header h2.raid-title .deeplink:hover{ text-decoration-color: var(--accent-venom); }
  .deeplink .link-ic{
    opacity:0; transform: translateX(-4px);
    font-size:14px; line-height:1; transition: opacity .15s ease, transform .15s ease;
    filter: saturate(.8);
  }
  .deeplink:hover .link-ic, .deeplink:focus-visible .link-ic{ opacity:1; transform: translateX(0); }
  .deeplink:focus-visible{ outline:none; text-decoration:underline; text-underline-offset:4px; }
  #copyFeedback{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(8px);
    background:#1c2236; color:#dbe3ff; border:1px solid rgba(110,132,255,.35);
    border-left:2px solid var(--accent-venom);
    padding:8px 14px; border-radius:10px; font-size:12.5px; font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
    opacity:0; pointer-events:none; transition: opacity .18s, transform .18s; z-index:99999;
  }
  #copyFeedback.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* Mech scannability */
  .strat ul{list-style:none; padding-left:0}
  .strat ul li.mech-item{
    padding:11px 12px; border:1px solid rgba(255,255,255,.06); border-radius:11px;
    background:linear-gradient(180deg, rgba(255,255,255,.015), rgba(255,255,255,.005));
    margin:10px 0;
  }
  .strat ul li.mech-item + li.mech-item{margin-top:12px}
  .mech-lead{font-weight:700; font-size:13.8px; line-height:1.45; margin-bottom:6px}
  .mech-lead strong{font-weight:800}
  .mech-subs{margin:6px 0 0 0; padding-left:16px !important; list-style:disc !important}
  .mech-subs li{padding:3px 0; margin:3px 0 !important; border:0 !important; background:transparent !important; font-size:12.9px; color:var(--muted); line-height:1.45}
  .mech-subs li::marker{color:var(--muted2); font-size:11px}
  .mech-divider{height:1px; background:linear-gradient(90deg, transparent, var(--line), transparent); margin:18px 0 8px; opacity:.8}
  .mech-ico{width:22px; height:22px; border-radius:7px; object-fit:cover; border:1px solid var(--line); vertical-align:middle; margin-right:6px; background:var(--panel3); display:inline-block}

  /* Spell tooltips - desktop only */
  .spell{
    position:relative;
  }
  @media (hover: hover) and (pointer: fine){
    .spell{cursor:help}
    .spell:hover,.spell:focus{filter:brightness(1.15); outline:none}
    .spell:focus-visible{box-shadow:0 0 0 2px rgba(122,236,236,.5), 0 0 0 4px rgba(122,236,236,.18)}
  }
  #spellTooltip{
    position:fixed;
    left:0; top:0;
    max-width:320px;
    width:max-content;
    max-width:min(320px, calc(100vw - 24px));
    background:linear-gradient(180deg, #1b1f2e 0%, #141824 100%);
    color:#e9ecf6;
    border:1px solid rgba(122,236,236,.38);
    border-left:3px solid #7aecec;
    border-radius:10px;
    padding:10px 12px 9px;
    font-size:12.7px;
    line-height:1.45;
    font-weight:500;
    box-shadow:0 12px 36px rgba(0,0,0,.55), 0 0 0 1px rgba(0,0,0,.4) inset, 0 1px 0 rgba(255,255,255,.06) inset;
    z-index:9999;
    opacity:0;
    transform:translateY(4px) scale(.98);
    pointer-events:none;
    transition:opacity .14s ease, transform .14s ease;
    text-wrap:pretty;
    white-space:normal;
  }
  #spellTooltip.show{
    opacity:1;
    transform:translateY(0) scale(1);
  }

// deeplink titles are <a href="#..."> – allow native hash navigation, show feedback, keep right-click copy working
document.addEventListener('click', (e)=>{
  const a=e.target.closest && e.target.closest('a.deeplink');
  if(!a) return;
  const href=a.getAttribute('href')||'';
  if(!href.startsWith('#')) return;
  const el=document.getElementById('copyFeedback');
  if(el){
    el.textContent='Link copied · '+href;
    el.classList.add('show');
    clearTimeout(window.__cf_t);
    window.__cf_t=setTimeout(()=>el.classList.remove('show'),1400);

});

const RAID_SHORT_SLUG={
  "Nek'zali the Soulcoiler":"nekzali",
  "Entombed Sentinels":"entombed-sentinels",
  "The Lost Explorers":"lost-explorers",
  "Vashnik the Malignant":"vashnik",

const RAID_SHORT_TO_NAME={
  "nekzali":"Nek'zali the Soulcoiler",
  "entombed-sentinels":"Entombed Sentinels",
  "lost-explorers":"The Lost Explorers",
  "vashnik":"Vashnik the Malignant",
  "sszorak":"Sszorak",
  "twin-fangs":"The Twin Fangs",
  "coiled-altar":"The Coiled Altar"
};
function resolveRaidName(n){ const map={"Vashnik the Water-Gazer":"Vashnik the Malignant","Sszorak the Ascended":"Sszorak","Ithrax & Vexhul - The Twin Fangs":"The Twin Fangs","Lost Explorers (Iku'nal & Nama'jin)":"The Lost Explorers"}; return map[n]||n; }

function dungeonSlug(name){
  return (name||'').toLowerCase().normalize('NFKD').replace(/[\u2019\u2018']/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').replace(/-+/g,'-');
}
function raidShort(name){ return RAID_SHORT_SLUG[name]||dungeonSlug(name); }
function raidHash(name){ return "raid-"+raidShort(name); }
function dungeonHash(name){ return "dungeon-"+dungeonSlug(name); }
const DUNGEON_SLUG_TO_NAME=(function(){
  const m={};
  const all=[...SEASON_2,...SEASON_1];
  all.forEach(n=>{ m[dungeonSlug(n)]=n; });
  return m;
})();
const DUNGEON_ORDER=[...SEASON_2,...SEASON_1];
const DEFAULT_HASH="raid-nekzali";

function parseHashToTarget(rawHash){
  if(!rawHash) return null;
  let h=rawHash.trim().toLowerCase();
  try{ h=decodeURIComponent(h);}catch(e){}
  h=h.replace(/^#/,'').trim();
  if(!h) return null;
  if(h.includes(':')){
    const idx=h.indexOf(':');
    const m=h.slice(0,idx).toLowerCase();
    let nm=h.slice(idx+1);
    try{ nm=decodeURIComponent(nm);}catch(e){}
    if(m==='raid'){
      const found=RAID_ORDER.find(r=>r.toLowerCase()===nm.toLowerCase());
      if(found) return {mode:'raid',name:found};
      const rn=RAID_SHORT_TO_NAME[nm.toLowerCase()]||RAID_SHORT_TO_NAME[dungeonSlug(nm)];
      if(rn) return {mode:'raid',name:rn};
      const r2=RAID_ORDER.find(r=>dungeonSlug(r)===dungeonSlug(nm));
      if(r2) return {mode:'raid',name:r2};
    }
    if(m==='dungeon'){
      const found=Object.keys(DUNGEONS).find(d=>d.toLowerCase()===nm.toLowerCase());
      if(found) return {mode:'dungeon',name:found};
      const dn=DUNGEON_SLUG_TO_NAME[dungeonSlug(nm)]||DUNGEON_SLUG_TO_NAME[nm.toLowerCase()];
      if(dn) return {mode:'dungeon',name:dn};
    }
  }
  if(h.startsWith('raid-')){
    const short=h.slice(5);
    if(RAID_SHORT_TO_NAME[short]) return {mode:'raid',name:RAID_SHORT_TO_NAME[short]};
    if(short.includes('nekzali')) return {mode:'raid',name:RAID_SHORT_TO_NAME['nekzali']};
    if(short.includes('entombed')) return {mode:'raid',name:RAID_SHORT_TO_NAME['entombed-sentinels']};
    if(short.includes('lost')||short.includes('explor')) return {mode:'raid',name:RAID_SHORT_TO_NAME['lost-explorers']};
    if(short.includes('vashnik')) return {mode:'raid',name:RAID_SHORT_TO_NAME['vashnik']};
    if(short.includes('sszorak')) return {mode:'raid',name:RAID_SHORT_TO_NAME['sszorak']};
    if(short.includes('twin')||short.includes('fangs')) return {mode:'raid',name:RAID_SHORT_TO_NAME['twin-fangs']};
    const raidBySlug=RAID_ORDER.find(r=>dungeonSlug(r)===short);
    if(raidBySlug) return {mode:'raid',name:raidBySlug};
  }
  if(h.startsWith('dungeon-')){
    const short=h.slice(8);
    if(DUNGEON_SLUG_TO_NAME[short]) return {mode:'dungeon',name:DUNGEON_SLUG_TO_NAME[short]};
    const direct=Object.keys(DUNGEON_SLUG_TO_NAME).find(k=>k===short||k.includes(short)||short.includes(k));
    if(direct) return {mode:'dungeon',name:DUNGEON_SLUG_TO_NAME[direct]};
  }
  if(RAID_SHORT_TO_NAME[h]) return {mode:'raid',name:RAID_SHORT_TO_NAME[h]};
  if(DUNGEON_SLUG_TO_NAME[h]) return {mode:'dungeon',name:DUNGEON_SLUG_TO_NAME[h]};
  for(const [short,name] of Object.entries(RAID_SHORT_TO_NAME)){
    if(short.includes(h)||h.includes(short)) return {mode:'raid',name:name};
  }
  let best=null;
  for(const [slug,name] of Object.entries(DUNGEON_SLUG_TO_NAME)){
    if(slug.startsWith(h)||slug.includes(h)||h.includes(slug)){
      if(!best || slug.length < best.slug.length) best={slug,name};
    }
  }
  if(best) return {mode:'dungeon',name:best.name};
  const exactDungeon=Object.keys(DUNGEONS).find(d=>d.toLowerCase()===h||dungeonSlug(d)===h);
  if(exactDungeon) return {mode:'dungeon',name:exactDungeon};
  const exactRaid=RAID_ORDER.find(r=>r.toLowerCase()===h);
  if(exactRaid) return {mode:'raid',name:exactRaid};
  return null;
}

function canonicalHashForTarget(t){
  if(!t) return DEFAULT_HASH;
  if(t.mode==='raid') return raidHash(t.name);
  return dungeonHash(t.name);
}

function getCurrentTargetFromHash(){
  let own=(location.hash||'').trim();
  let target=parseHashToTarget(own);
  if(target) return target;
  try{
    if(window.parent && window.parent!==window){
      const ph=window.parent.location.hash;
      if(ph){
        const pt=parseHashToTarget(ph);
        if(pt) return pt;
      }
    }
  }catch(e){}
  return null;
}

function imgSrc(n){if(!n) return null; const m=(IMAGE_MAP[n]||n); return `assets/${m}`}

// Internal state – no hash
let mode = (function(){ try{ return localStorage.getItem('midnight:mode')||'raid'; }catch(e){return 'raid';}})();
let selectedDungeon = (function(){ try{ return localStorage.getItem('midnight:dungeon')||DUNGEON_ORDER[0]; }catch(e){return DUNGEON_ORDER[0];}})();
let selectedRaid = (function(){ try{ return localStorage.getItem('midnight:raid')||RAID_ORDER[0]; }catch(e){return RAID_ORDER[0];}})();
if(!DUNGEONS[selectedDungeon]) selectedDungeon=DUNGEON_ORDER[0];
if(!RAID_DATA[selectedRaid]) selectedRaid=RAID_ORDER[0];
if(mode!=='dungeon' && mode!=='raid') mode='raid';
// Force default to raid Nek'zali if fresh (ignore previous dungeon default for this product)
if(!((function(){try{return localStorage.getItem('midnight:mode');}catch(e){return null;}})())){
  mode='raid'; selectedRaid=RAID_ORDER[0];
}

function buildSidebar(){
  const list=qs('#dungeonList'); const mobileSel=qs('#mobileSelect');
  const q=query.toLowerCase().trim();
  qs('#swDungeon').classList.toggle('active',mode==="dungeon");
  qs('#swRaid').classList.toggle('active',mode==="raid");
  qs('#swDungeon').setAttribute('aria-selected',mode==="dungeon");
  qs('#swRaid').setAttribute('aria-selected',mode==="raid");

  if(mode==="dungeon"){
    const isMatch=(name)=>{
      if(!q) return true;
      if(name.toLowerCase().includes(q)) return true;
      const d=DUNGEONS[name]; if(!d) return false;
      return d.bosses.some(b=>{if(b.name.toLowerCase().includes(q)) return true; return b.tips.some(t=>t.text.toLowerCase().includes(q))})
    };
    const btnHtml=(name)=>{
      const d=DUNGEONS[name]; if(!d) return '';
      const active=name===selectedDungeon?'active':'';
      const count=d.bosses.length;
      const matchCount=q?d.bosses.reduce((acc,b)=>acc+(b.name.toLowerCase().includes(q)?1:0)+b.tips.filter(t=>t.text.toLowerCase().includes(q)).length,0):0;
      return `<button class="dungeon-btn ${active}" data-name="${escapeAttr(name)}"><span class=\"name\">${escapeHtml(name)}${q&&matchCount? ` <span style=\"color:var(--gold2);font-size:11px\">· ${matchCount}</span>`:''}</span><span class=\"count\">${count}</span></button>`
    };
    const s2=SEASON_2.filter(isMatch); const s1=SEASON_1.filter(isMatch);
    if(!q){
      list.innerHTML=`<div class="season-head">Season 2</div>${SEASON_2.map(n=>btnHtml(n)).join('')}<div class="season-head">Season 1</div>${SEASON_1.map(n=>btnHtml(n)).join('')}`;
    }else{
      const parts=[]; if(s2.length){parts.push(`<div class="season-head">Season 2</div>`); parts.push(s2.map(n=>btnHtml(n)).join(''))} if(s1.length){parts.push(`<div class="season-head">Season 1</div>`); parts.push(s1.map(n=>btnHtml(n)).join(''))} list.innerHTML=parts.join('')||`<div class="no-results" style="margin:8px">No dungeons match “${escapeHtml(query)}”</div>`;
    }
    mobileSel.innerHTML=`<optgroup label="Season 2">${SEASON_2.map(n=>`<option value="d:${escapeAttr(n)}" ${selectedDungeon===n?'selected':''}>${escapeHtml(n)}</option>`).join('')}</optgroup><optgroup label="Season 1">${SEASON_1.map(n=>`<option value="d:${escapeAttr(n)}" ${selectedDungeon===n?'selected':''}>${escapeHtml(n)}</option>`).join('')}</optgroup>`;
    list.querySelectorAll('.dungeon-btn').forEach(btn=>{ btn.addEventListener('click',()=>{ selectedDungeon=btn.dataset.name; mode='dungeon'; try{localStorage.setItem('midnight:dungeon',selectedDungeon); localStorage.setItem('midnight:mode','dungeon');}catch(e){} render(); }) });
  }else{
    const isRaidMatch=(n)=>{
      if(!q) return true; const lower=q; if(n.toLowerCase().includes(lower)) return true; const d=RAID_DATA[n]; if(!d) return false; return (d.tldr&&d.tldr.toLowerCase().includes(lower)) || JSON.stringify(d).toLowerCase().includes(lower);
    };
    const filtered=RAID_ORDER.filter(isRaidMatch);
    const btnHtml=(name)=>{
      const d=RAID_DATA[name]; const active=name===selectedRaid?'raid-active':''; const iconSrc=RAID_ICONS[name]; const fallbackLetter=escapeHtml(name.trim().charAt(0)||'R'); const iconHtml=iconSrc?`<img class="raid-ico" src="${escapeAttr(iconSrc)}" alt="${escapeAttr(name)}" loading="lazy" data-fallback="${fallbackLetter}" onerror="this.outerHTML='<span class=&quot;raid-ico&quot; style=&quot;width:32px;height:32px;display:grid;place-items:center;background:var(--panel3);border:1px solid var(--line);border-radius:9px;font-size:13px;font-weight:800;color:var(--muted)&quot;>${fallbackLetter}</span>'"/>`:`<span style=\"width:32px;height:32px;display:grid;place-items:center;background:var(--panel3);border:1px solid var(--line);border-radius:9px;font-size:13px;font-weight:800;color:var(--muted)\">${fallbackLetter}</span>`;
      return `<button class="dungeon-btn ${active}" data-rname="${escapeAttr(name)}"><span style=\"display:flex;align-items:center;gap:10px;min-width:0\"><span style=\"display:flex\">${iconHtml}</span><span class=\"name\" style=\"display:flex;flex-direction:column;line-height:1.2\"><span>${escapeHtml(name)}</span><span style=\"font-size:11px;opacity:.7;font-weight:400\">${escapeHtml(d.short)}</span></span></span><span class=\"count\">S2</span></button>`
    };
    list.innerHTML=`<div class="season-head raid-head">The Venomous Abyss — Season 2 Raid</div>${filtered.map(n=>btnHtml(n)).join('')}${!filtered.length?`<div class="no-results" style="margin:8px">No raid bosses match “${escapeHtml(query)}”</div>`:''}`;
    mobileSel.innerHTML=`<optgroup label="The Venomous Abyss">${RAID_ORDER.map(n=>`<option value="r:${escapeAttr(n)}" ${n===selectedRaid?'selected':''}>${escapeHtml(n)}</option>`).join('')}</optgroup>`;
    list.querySelectorAll('[data-rname]').forEach(btn=>{ btn.addEventListener('click',()=>{ selectedRaid=btn.dataset.rname; mode='raid'; try{localStorage.setItem('midnight:raid',selectedRaid); localStorage.setItem('midnight:mode','raid');}catch(e){} render(); }) });
  }
  mobileSel.onchange=(e)=>{
    const v=e.target.value;
    if(v.startsWith('r:')){ selectedRaid=v.slice(2); mode='raid'; try{localStorage.setItem('midnight:raid',selectedRaid); localStorage.setItem('midnight:mode','raid');}catch(e){} render(); }
    else { selectedDungeon=v.slice(2); mode='dungeon'; try{localStorage.setItem('midnight:dungeon',selectedDungeon); localStorage.setItem('midnight:mode','dungeon');}catch(e){} render(); }
  };
}

function tipHtml(tip,idx,bossName){
  const src=tip.image?imgSrc(tip.image):null; const hasImg=!!tip.image;
  return `<div class="tip-row"><div class="tip-text"><div class="tip-num">${idx+1}</div><div>${enrichText(tip.text)}</div></div><div class="tip-media ${hasImg?'':'empty'}" ${hasImg?'':'style="display:none"'}>${hasImg?`<img loading="lazy" src="${src}" alt="${escapeAttr(bossName)} mechanic ${idx+1}: ${escapeAttr(tip.image)}" onerror="this.parentElement.style.display='none'; this.closest('.tip-row').style.gridTemplateColumns='1fr'" /> <span class=\"img-badge\">📸 ${escapeHtml(tip.image)}</span>`:''}</div></div>`;
}

function enrichText(s){
  if(!s) return "";
  // All styling is now hardcoded as true-meaning markup in data — no runtime string find/replace.
  // Data already contains <span class=\"role\">, <span class=\"action\">, <span class=\"spell\" data-tooltip> etc.
  return s;
}
function escapeReg(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}

function renderDungeonContent(){
  const toName=selectedDungeon||DUNGEON_ORDER[0]; const d=DUNGEONS[toName]||DUNGEONS[Object.keys(DUNGEONS)[0]]; const finalName=Object.keys(DUNGEONS).find(k=>k===toName)||toName;
  qs('#dungeonTitle').className=''; qs('#dungeonTitle').textContent=finalName;
  qs('#headerMeta').innerHTML=`<span class=\"pill\">Season ${SEASON_2.includes(finalName)?'2':'1'} • ${d.bosses.length} bosses</span> <span class=\"pill\"><kbd>/</kbd> to search • <kbd>Esc</kbd> closes image</span>`;
  const __notice2=qs('#notice'); if(__notice2){ __notice2.style.display='flex'; __notice2.removeAttribute('aria-hidden'); } qs('#noticeTitle').textContent='How to use:'; qs('#noticeText').textContent=' pick a dungeon left, then skim boss cards. Each tip has mechanic text and — when available — inline reference screenshot. Click any image to zoom.';
  const grid=qs('#bossGrid'); const q=query.toLowerCase().trim(); let bosses=d.bosses; if(q){ bosses=bosses.map(b=>{ const bossMatch=b.name.toLowerCase().includes(q); const tips=b.tips.filter(t=>!q||t.text.toLowerCase().includes(q)||bossMatch); if(bossMatch||tips.length) return {...b,tips:tips.length?tips:b.tips,_highlight:bossMatch}; return null }).filter(Boolean); if(!bosses.length){grid.innerHTML=`<div class="no-results">No tips in <b>${escapeHtml(finalName)}</b> match “${escapeHtml(query)}”. Try clearing search or pick another dungeon.</div>`; return} } grid.innerHTML=bosses.map((boss,bi)=>{ const filteredTips=boss.tips; return `<div class="boss-card" id="boss-${slug(boss.name)}"><div class="boss-head"><h3><span class=\"boss-icon\">${bi+1}</span>${escapeHtml(boss.name)}</h3><span class=\"mini\">${filteredTips.length} mechanics • ${boss.tips.length===filteredTips.length?'all':'filtered'}</span></div><div class="tips">${filteredTips.map((t,i)=>tipHtml(t,i,boss.name)).join('')}</div></div>` }).join(''); grid.querySelectorAll('.tip-media img').forEach(img=>{img.addEventListener('click',()=>openLightbox(img.src,img.alt))});
}

function renderMechItem(it){
  if(!it) return ""; if(typeof it==="string"){ return `<li class="mech-item"><div class="mech-lead">${enrichText(it)}</div></li>`; } const iconFor=(()=>{ const key=(it.lead||"").toLowerCase(); if(key.includes("toxic")||key.includes("droplets")) return RAID_ICONS["Entombed Sentinels"]; if(key.includes("mighty")||key.includes("thud")) return "assets/raid/lost-mighty-thud.jpg"; if(key.includes("frostfire")) return "assets/raid/lost-frostfire.jpg"; if(key.includes("bomb")||key.includes("explosive")) return "assets/raid/lost-bomb-mushroom.jpg"; if(key.includes("cyst")||key.includes("surge")) return "assets/raid/sszorak-cysts.jpg"; if(key.includes("crosswind")) return "assets/raid/sszorak-crosswinds.jpg"; if(key.includes("mutilate")) return "assets/raid/sszorak-mutilate.jpg"; if(key.includes("deluge")||key.includes("glob")) return "assets/raid/fangs-globules.jpg"; if(key.includes("flood")) return "assets/raid/fangs-flood.jpg"; if(key.includes("spit")||key.includes("emergence")) return "assets/raid/fangs-spit.jpg"; if(key.includes("ichor")) return "assets/raid/fangs-ichor.jpg"; return null; })(); const ico=iconFor?`<img class="mech-ico" src="${escapeAttr(iconFor)}" alt="" loading="lazy" onerror="this.style.display='none'"/>`:""; const subs=(it.subs||[]).map(s=>`<li>${enrichText(s)}</li>`).join(''); return `<li class="mech-item"><div class="mech-lead">${ico}<strong>${enrichText(it.lead)}</strong></div>${subs?`<ul class="mech-subs">${subs}</ul>`:''}</li>`;
}

function renderRaidContent(){
  const realName=selectedRaid; const data=RAID_DATA[realName]; if(!data){ qs('#bossGrid').innerHTML=`<div class="no-results">Raid boss not found: ${escapeHtml(realName||'')}</div>`; return; }
  qs('#dungeonTitle').className='raid-title'; qs('#dungeonTitle').textContent=realName;
  qs('#headerMeta').innerHTML=`<span class=\"pill venom\">Boss ${data.bossNum} / ${RAID_ORDER.length} • Season 2 Raid</span> <span class=\"pill\">2/4/14 • Heroic summaries</span> <span class=\"pill\"><kbd>click</kbd> images to zoom</span>`;
  const __notice=qs('#notice'); if(__notice){ __notice.style.display='none'; __notice.setAttribute('aria-hidden','true'); } const q=query.toLowerCase().trim();
  let html=`<div class="boss-card"><div class="boss-head raid-head"><h3><span class=\"boss-icon raid\">${data.bossNum}</span>${escapeHtml(realName)}<span style=\"margin-left:10px;font-size:12px;color:var(--muted);font-weight:500\">— ${escapeHtml(data.short)}</span></h3><span class=\"mini\">TL;DR + Setup + Strat</span></div><div class="raid-body">`;
  html+=`<div class="tldr venom-tldr"><strong>TL;DR:</strong> ${escapeHtml(data.tldr)}</div>`; if(TANK_SWAP[realName]){ html+=`<div class="tank-box"><div class="tank-box-head"><span class=\"tb-icon\">🛡️</span> Tank Swap / Taunt</div>${TANK_SWAP[realName]}</div>`; } html+=`<div class="setup-line"><span class=\"pill venom\">${escapeHtml(data.setup)}</span>${data.bossNum===1?`<span class=\"pill\">Tower-defense • 100 energy enrage</span>`:''}${data.bossNum===2?`<span class=\"pill\">40y DR • Even HP</span>`:''}${data.bossNum===6?`<span class=\"pill\">Eternal Venom 10 = death</span>`:''}</div>`;
  const section=(title,items)=>{ if(!items||!items.length) return ""; if(q && !JSON.stringify(items).toLowerCase().includes(q) && !title.toLowerCase().includes(q)) return ""; const inner=Array.isArray(items)?items.map(it=>renderMechItem(it)).join(''):`<li class="mech-item"><div class="mech-lead">${enrichText(items)}</div></li>`; return `<div class="strat"><h4 class="raid-h">${escapeHtml(title)}</h4><ul>${inner}</ul><div class="mech-divider"></div></div>`; };
  if(data.strategy) html+=section(data.bossNum===7?"Stage One — Serpent's Bargain":"Core — Phase 1 loop",data.strategy); if(data.green) html+=section("Green Golem (Breath)",data.green); if(data.red) html+=section("Red Golem (Blood)",data.red); if(data.intermission) html+=section(data.bossNum===7?"Intermission — Claimed Vessel":"Intermission — Energy 100",data.bossNum===7?data.intermission:(data.bossNum===1?"Intermission — 50% cleanup":data.intermission)); if(data.p2) html+=section(data.bossNum===7?"Stage Two — Usurper's Reprisal":"Phase 2 — Burn",data.p2); if(data.tanks) html+=section("Tanks",[data.tanks]); if(data.tanks2) html+=section("Tanks — Soul Sever",data.tanks2); if(data.boxes) html+=section("Box / Fish Economy",[data.boxes]); if(data.feed) html+=section("Feed Order",[data.feed]); if(data.ultimates) html+=section("Ultimates",data.ultimates); if(data.enrage) html+=section("Enrage / Kill Together",[data.enrage]); if(data.rotation) html+=section("Rotation",data.rotation); if(data.adds) html+=section("Add Control",data.adds); if(data.infections) html+=section("Infections (telegraphed by Fountain)",data.infections); if(data.passive) html+=section("Passive Checklist",data.passive); if(data.apex) html+=section("Apex Predator",data.apex); if(data.surge) html+=section("Venomous Surge + Cysts",data.surge); if(data.crosswinds) html+=section("Raging Crosswinds",data.crosswinds); if(data.core) html+=section("Core Rotation",data.core); if(data.feast) html+=section("Ravenous Feast — Venom Refund",data.feast); if(data.submerge) html+=section("Submerge 100 — Combined Assault",data.submerge); if(data.p3) html+=section("Stage Three — Coiled Union",data.p3);
  if(data.images && data.images.length){ const matches = q? data.images.filter(img=>img.cap.toLowerCase().includes(q)): data.images; if(matches.length){ html+=`<div class="strat"><h4 class="raid-h">Maps & Positions — click to zoom</h4><div class="img-grid">`; matches.forEach(img=>{ html+=`<div class="img-card"><img loading="lazy" src="${escapeAttr(img.src)}" alt="${escapeAttr(img.cap)}" onerror="this.parentElement.style.display='none'"/><div class="cap">${escapeHtml(img.cap)}</div></div>`; }); html+=`</div></div>`; } } html+=`</div></div>`; qs('#bossGrid').innerHTML=html; qs('#bossGrid').querySelectorAll('.img-card img').forEach(im=>im.addEventListener('click',()=>openLightbox(im.src,im.alt)));
}

function getDungeonNav(){ const idx=DUNGEON_ORDER.indexOf(selectedDungeon); const prev=idx>0?DUNGEON_ORDER[idx-1]:null; const next=idx>=0&&idx<DUNGEON_ORDER.length-1?DUNGEON_ORDER[idx+1]:null; return {idx,prev,next}; }
function getRaidNav(){ const raw=RAID_ORDER.indexOf(selectedRaid); const idx=raw>=0?raw:0; const prev=idx>0?RAID_ORDER[idx-1]:null; const next=idx>=0&&idx<RAID_ORDER.length-1?RAID_ORDER[idx+1]:null; return {idx,prev,next}; }

function renderPrevNext(){
  const top=qs('#topPrevNext'); if(!top) return; let prev=null,next=null,isRaid=mode==='raid'; if(mode==="dungeon"){ const nav=getDungeonNav(); prev=nav.prev; next=nav.next; } else { const nav=getRaidNav(); prev=nav.prev; next=nav.next; }
  const mkBtn=(label,size,dir)=>{ if(!label){return `<button class="pn-btn ${size} ${isRaid?'venom':'gold'} disabled" disabled aria-disabled="true"><span class=\"pn-hint\">${dir==='prev'?'Prev':'Next'}</span><span class=\"pn-label\">—</span></button>`} const arrow=dir==='prev'?'←':'→'; const txt=dir==='prev'?`${arrow} ${label}`:`${label} ${arrow}`; return `<button class="pn-btn ${size} ${isRaid?'venom':'gold'}" data-go="${escapeAttr(label)}" data-dir="${dir}"><span class=\"pn-hint\">${dir==='prev'?'Prev':'Next'}</span><span class=\"pn-label\">${escapeHtml(txt)}</span></button>`; }; const mkHidden=()=>`<span style=\"opacity:.22;font-size:12px;color:var(--muted2)\">— end —</span>`; if(mode==="dungeon"){ const {prev:pr,next:nx}=getDungeonNav(); top.innerHTML=`<div style="display:flex;gap:8px;align-items:center;flex:1;justify-content:flex-start">${pr?mkBtn(pr,'small','prev'):mkHidden()}</div><div style="display:flex;gap:8px;align-items:center;justify-content:flex-end;flex:1">${nx?mkBtn(nx,'small','next'):mkHidden()}</div>`; } else { const {prev:pr,next:nx}=getRaidNav(); top.innerHTML=`<div style="display:flex;gap:8px;align-items:center;flex:1;justify-content:flex-start">${pr?mkBtn(pr,'small','prev'):mkHidden()}</div><div style="display:flex;gap:8px;align-items:center;justify-content:flex-end;flex:1">${nx?mkBtn(nx,'small','next'):mkHidden()}</div>`; } top.querySelectorAll('[data-go]').forEach(btn=>{ btn.addEventListener('click',()=>{ const dest=btn.getAttribute('data-go'); if(mode==="dungeon"){ selectedDungeon=dest; mode='dungeon'; try{localStorage.setItem('midnight:dungeon',dest); localStorage.setItem('midnight:mode','dungeon');}catch(e){} render(); }else{ selectedRaid=dest; mode='raid'; try{localStorage.setItem('midnight:raid',dest); localStorage.setItem('midnight:mode','raid');}catch(e){} render(); } const g=qs('#bossGrid'); if(g) g.scrollIntoView({behavior:'smooth',block:'start'}); }); });
}

function render(){
  buildSidebar(); if(mode==="dungeon") renderDungeonContent(); else renderRaidContent(); renderPrevNext();
}

function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escapeAttr(s){return (s||'').replace(/"/g,'&quot;')}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function openLightbox(src,alt){const lb=qs('#lightbox'); const img=qs('#lbImg'); img.src=src; img.alt=alt||'Screenshot'; lb.classList.add('open'); lb.setAttribute('aria-hidden','false')}
function closeLightbox(){const lb=qs('#lightbox'); lb.classList.remove('open'); lb.setAttribute('aria-hidden','true')}

qs('#q').addEventListener('input',(e)=>{query=e.target.value; qs('#clearQ').classList.toggle('show',!!query); buildSidebar(); if(mode==="dungeon") renderDungeonContent(); else renderRaidContent(); renderPrevNext();});
qs('#clearQ').addEventListener('click',()=>{query=''; qs('#q').value=''; qs('#clearQ').classList.remove('show'); buildSidebar(); if(mode==="dungeon") renderDungeonContent(); else renderRaidContent(); renderPrevNext(); qs('#q').focus()});
qs('#lbClose').addEventListener('click',closeLightbox); qs('#lightbox').addEventListener('click',(e)=>{if(e.target.id==='lightbox') closeLightbox()});
qs('#swDungeon').addEventListener('click',()=>{mode="dungeon"; try{localStorage.setItem('midnight:mode','dungeon');}catch(e){} render()}); qs('#swRaid').addEventListener('click',()=>{mode="raid"; try{localStorage.setItem('midnight:mode','raid');}catch(e){} render()});
document.addEventListener('keydown',(e)=>{ if(e.key==='Escape'){ closeLightbox(); return; } if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='SELECT'){e.preventDefault(); qs('#q').focus(); return;} if((e.key==='ArrowLeft'||e.key==='ArrowRight') && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){ if(mode==="dungeon"){ const {prev,next}=getDungeonNav(); if(e.key==='ArrowLeft'&&prev){ e.preventDefault(); selectedDungeon=prev; try{localStorage.setItem('midnight:dungeon',prev);}catch(e){} render(); } if(e.key==='ArrowRight'&&next){ e.preventDefault(); selectedDungeon=next; try{localStorage.setItem('midnight:dungeon',next);}catch(e){} render(); } }else{ const {prev,next}=getRaidNav(); if(e.key==='ArrowLeft'&&prev){ e.preventDefault(); selectedRaid=prev; try{localStorage.setItem('midnight:raid',prev);}catch(e){} render(); } if(e.key==='ArrowRight'&&next){ e.preventDefault(); selectedRaid=next; try{localStorage.setItem('midnight:raid',next);}catch(e){} render(); } } } });

// Initial render – no hash, pure internal
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', ()=>{ render(); }, {once:true});
}else{
  render();
}

// ---- Spell tooltips - desktop only ----
(function(){
  const tipEl=qs('#spellTooltip'); if(!tipEl) return; let activeSpell=null; let hideTimer=null;
  const isDesktopTooltipEnabled=()=>{ if(window.innerWidth<=768) return false; try{ if(window.matchMedia){ if(!window.matchMedia('(hover: hover)').matches) return false; if(!window.matchMedia('(pointer: fine)').matches) return false; } }catch(e){} return true; };
  const curModeIsRaid=()=> mode==='raid';
  const placeTooltip=(spellEl)=>{ if(!isDesktopTooltipEnabled()) return; const text=spellEl.getAttribute('data-tooltip'); if(!text) return; tipEl.textContent=text; tipEl.setAttribute('aria-hidden','false'); tipEl.style.left='0px'; tipEl.style.top='0px'; tipEl.classList.add('show'); const rect=spellEl.getBoundingClientRect(); const tipRect=tipEl.getBoundingClientRect(); const vpW=window.innerWidth; const vpH=window.innerHeight; const gap=10; let top=rect.top - tipRect.height - gap; let left=rect.left + rect.width/2 - tipRect.width/2; let flip=false; if(top < 8){ top=rect.bottom + gap; flip=true; } const pad=8; if(left < pad) left=pad; if(left + tipRect.width > vpW - pad) left=vpW - tipRect.width - pad; if(top + tipRect.height > vpH - pad){ if(flip){ const altTop=rect.top - tipRect.height - gap; if(altTop>=pad) top=altTop, flip=false; else top=vpH - tipRect.height - pad; } else top=vpH - tipRect.height - pad; } if(top < pad) top=pad; tipEl.style.left=left+'px'; tipEl.style.top=top+'px'; tipEl.classList.toggle('flip-above', flip); };
  const hideTooltip=()=>{ tipEl.classList.remove('show'); tipEl.setAttribute('aria-hidden','true'); activeSpell=null; }; const scheduleHide=()=>{ clearTimeout(hideTimer); hideTimer=setTimeout(hideTooltip, 80); };
  document.addEventListener('mouseover',(e)=>{ if(!isDesktopTooltipEnabled()) return; const sp=e.target.closest && e.target.closest('.spell[data-tooltip]'); if(!sp) return; if(!curModeIsRaid()) return; clearTimeout(hideTimer); activeSpell=sp; placeTooltip(sp); });
  document.addEventListener('mouseout',(e)=>{ const sp=e.target.closest && e.target.closest('.spell[data-tooltip]'); if(!sp) return; const rel=e.relatedTarget; if(rel && rel.closest && rel.closest('#spellTooltip')) return; if(sp===activeSpell) scheduleHide(); });
  tipEl.addEventListener('mouseenter',()=>{ clearTimeout(hideTimer); }); tipEl.addEventListener('mouseleave',scheduleHide);
  document.addEventListener('focusin',(e)=>{ if(!isDesktopTooltipEnabled()) return; const sp=e.target.closest && e.target.closest('.spell[data-tooltip]'); if(!sp) return; if(!curModeIsRaid()) return; activeSpell=sp; placeTooltip(sp); });
  document.addEventListener('focusout',(e)=>{ const sp=e.target.closest && e.target.closest('.spell[data-tooltip]'); if(sp) scheduleHide(); });
  window.addEventListener('scroll', hideTooltip, {passive:true}); window.addEventListener('resize', hideTooltip); document.addEventListener('keydown',(e)=>{ if(e.key==='Escape') hideTooltip(); });
  const bg=qs('#bossGrid'); if(bg && window.MutationObserver){ const obs=new MutationObserver(()=>hideTooltip()); obs.observe(bg,{childList:true, subtree:false}); }
})();

</script>
</body>
